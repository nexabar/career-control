<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карьер Контроль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 40px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 16px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: 6px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        select, input, textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-color);
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        .eq-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .eq-row span {
            font-size: 14px;
            font-weight: 500;
        }

        .eq-row select {
            width: 140px;
            margin-bottom: 0;
            padding: 8px;
        }

        .btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .chart-container {
            position: relative;
            height: 190px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚜 Карьер Контроль</h2>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Всего добыто</div>
                <div class="stat-value" id="totalVolumeStat">0 т</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Статус смены</div>
                <div class="stat-value" style="font-size: 16px; color: var(--success); margin-top: 10px;">Активна</div>
            </div>
        </div>

        <!-- График -->
        <div class="card">
            <label>Динамика добычи по дням</label>
            <div class="chart-container">
                <canvas id="productionChart"></canvas>
            </div>
        </div>

        <!-- Форма отправки отчета -->
        <div class="card">
            <label>Номер смены</label>
            <select id="shift">
                <option value="1">Смена №1 (Дневная)</option>
                <option value="2">Смена №2 (Ночная)</option>
            </select>

            <label>Объем добычи (тонн)</label>
            <input type="number" id="volume" placeholder="Введите объем добычи в тоннах">

            <label>Состояние техники</label>
            
            <div class="eq-row">
                <span>БелАЗ</span>
                <select id="belaz">
                    <option value="Исправен">Исправен</option>
                    <option value="Ремонт">Ремонт</option>
                </select>
            </div>

            <div class="eq-row">
                <span>CAT</span>
                <select id="cat">
                    <option value="Исправен">Исправен</option>
                    <option value="Ремонт">Ремонт</option>
                </select>
            </div>

            <div class="eq-row">
                <span>Komatsu</span>
                <select id="komatsu">
                    <option value="Исправен">Исправен</option>
                    <option value="Ремонт">Ремонт</option>
                </select>
            </div>

            <label style="margin-top: 10px;">Комментарий</label>
            <textarea id="comment" rows="2" placeholder="Дополнительные примечания по смене..."></textarea>

            <button class="btn" id="submitBtn">Отправить отчёт</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Считываем общую добычу из URL
        const urlParams = new URLSearchParams(window.location.search);
        const totalVol = urlParams.get('total') || '0';
        document.getElementById('totalVolumeStat').innerText = Number(totalVol).toLocaleString() + ' т';

        // Инициализация графика в синих тонах
        const ctx = document.getElementById('productionChart').getContext('2d');
        const productionChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
                datasets: [{
                    label: 'Добыча (т)',
                    data: [1150, 1300, 1050, 1420, 1380, 1550, Number(totalVol) || 1250],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.12)',
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.35,
                    pointBackgroundColor: '#3b82f6',
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: '#94a3b8', font: { size: 12 } }
                    },
                    y: {
                        grid: { color: 'rgba(51, 65, 85, 0.4)' },
                        ticks: { color: '#94a3b8', font: { size: 12 } }
                    }
                }
            }
        });

        // Обработка клика отправки отчета
        document.getElementById('submitBtn').addEventListener('click', function() {
            const shift = document.getElementById('shift').value;
            const volume = document.getElementById('volume').value;
            
            if (!volume || volume <= 0) {
                alert('Пожалуйста, введите объем добычи!');
                return;
            }

            const data = {
                action: "submit_report",
                shift: shift,
                volume: volume,
                equipment: {
                    belaz: document.getElementById('belaz').value,
                    cat: document.getElementById('cat').value,
                    komatsu: document.getElementById('komatsu').value
                },
                comment: document.getElementById('comment').value,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
