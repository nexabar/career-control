<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карьер Контроль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --button-bg: #2563eb;
            --button-hover: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .form-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .slider-val {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: var(--text-main);
            font-size: 14px;
        }

        .equipment-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .eq-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .eq-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .eq-name {
            font-size: 14px;
            font-weight: 600;
        }

        .eq-type {
            font-size: 12px;
            color: var(--text-muted);
        }

        .action-btn {
            background: var(--button-bg);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .action-btn:active {
            background: var(--button-hover);
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>Карьер Контроль</h1>
            <p id="userName">Оператор: Загрузка...</p>
        </div>
        <div>
            <select id="shiftSelect" style="padding: 4px 8px; font-size: 12px;">
                <option value="1">Смена 1 (Дневная)</option>
                <option value="2">Смена 2 (Ночная)</option>
            </select>
        </div>
    </div>

    <!-- Ввод объема добычи -->
    <div class="form-group">
        <label>Фактическая добыча за смену</label>
        <div class="slider-val"><span id="volumeValue">1400</span> тонн</div>
        <input type="range" id="volumeRange" min="500" max="3000" step="50" value="1400" oninput="document.getElementById('volumeValue').textContent = this.value">
    </div>

    <!-- Управление техникой -->
    <div class="form-group">
        <label>Статус техники на объекте</label>
        <div class="equipment-list">
            <div class="eq-item">
                <div class="eq-info">
                    <span class="eq-name">Самосвал BelAZ #102</span>
                    <span class="eq-type">Водитель: Иванов В.</span>
                </div>
                <select id="eq1" style="width: auto;">
                    <option value="На рейсе">На рейсе</option>
                    <option value="Погрузка">Погрузка</option>
                    <option value="На ТО">На ТО</option>
                </select>
            </div>
            <div class="eq-item">
                <div class="eq-info">
                    <span class="eq-name">Экскаватор CAT 349</span>
                    <span class="eq-type">Забой №3</span>
                </div>
                <select id="eq2" style="width: auto;">
                    <option value="Погрузка" selected>Погрузка</option>
                    <option value="На рейсе">На рейсе</option>
                    <option value="На ТО">На ТО</option>
                </select>
            </div>
            <div class="eq-item">
                <div class="eq-info">
                    <span class="eq-name">Бульдозер Komatsu D375</span>
                    <span class="eq-type">Отвал №2</span>
                </div>
                <select id="eq3" style="width: auto;">
                    <option value="На ТО" selected>На ТО</option>
                    <option value="В работе">В работе</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Замечания -->
    <div class="form-group">
        <label>Замечания / Комментарий</label>
        <input type="text" id="comment" placeholder="Например: задержка на погрузке 15 мин">
    </div>

    <button class="action-btn" onclick="sendDataToBot()">
        📝 Отправить полный отчет в базу
    </button>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            if (tg.initDataUnsafe?.user) {
                document.getElementById('userName').textContent = 
                    `Оператор: ${tg.initDataUnsafe.user.first_name || 'Смена'}`;
            }
        }

        function sendDataToBot() {
            const payload = {
                action: "submit_report",
                shift: document.getElementById('shiftSelect').value,
                volume: document.getElementById('volumeRange').value,
                equipment: {
                    belaz: document.getElementById('eq1').value,
                    cat: document.getElementById('eq2').value,
                    komatsu: document.getElementById('eq3').value
                },
                comment: document.getElementById('comment').value || "Без замечаний",
                timestamp: new Date().toLocaleString("ru-RU")
            };

            if (tg) {
                tg.sendData(JSON.stringify(payload));
            } else {
                alert("Данные сформированы: " + JSON.stringify(payload));
            }
        }
    </script>
</body>
</html>
