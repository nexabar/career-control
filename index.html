<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карьер Контроль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #ff9800;
        }

        /* Навигация по вкладкам */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #aaa;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background-color: #ff9800;
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Стили формы */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        .status-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
        }

        .status-select {
            width: auto;
            padding: 5px 10px;
        }

        /* Дашборд и Аналитика */
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
        }

        .progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff9800, #4caf50);
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        .stats-summary {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-top: 8px;
            color: #ccc;
        }

        .chart-box {
            position: relative;
            height: 220px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h2>🚜 Карьер Контроль</h2>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('form')">📝 Сдать смену</button>
        <button class="tab-btn" onclick="switchTab('analytics')">📊 Аналитика</button>
    </div>

    <!-- ВКЛАДКА 1: Форма сдачи смены -->
    <div id="tab-form" class="tab-content active">
        <div class="form-group">
            <label for="shift">Выберите смену:</label>
            <select id="shift">
                <option value="1">Дневная смена (08:00 - 20:00)</option>
                <option value="2">Ночная смена (20:00 - 08:00)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="volume">Объем добычи (тонн):</label>
            <input type="number" id="volume" placeholder="Например: 1200" required>
        </div>

        <h3>Состояние техники</h3>
        <div class="status-group">
            <span>🚛 БелАЗ #1</span>
            <select id="belaz" class="status-select">
                <option value="Исправен">🟢 Исправен</option>
                <option value="В ремонте">🔴 В ремонте</option>
                <option value="ТО">🟡 На ТО</option>
            </select>
        </div>

        <div class="status-group">
            <span>🚜 Экскаватор CAT</span>
            <select id="cat" class="status-select">
                <option value="Исправен">🟢 Исправен</option>
                <option value="В ремонте">🔴 В ремонте</option>
                <option value="ТО">🟡 На ТО</option>
            </select>
        </div>

        <div class="status-group">
            <span>🏗 Бульдозер Komatsu</span>
            <select id="komatsu" class="status-select">
                <option value="Исправен">🟢 Исправен</option>
                <option value="В ремонте">🔴 В ремонте</option>
                <option value="ТО">🟡 На ТО</option>
            </select>
        </div>

        <div class="form-group">
            <label for="comment">Комментарии / Замечания:</label>
            <textarea id="comment" rows="3" placeholder="Опишите простои или поломки..."></textarea>
        </div>
    </div>

    <!-- ВКЛАДКА 2: Дашборд и Аналитика -->
    <div id="tab-analytics" class="tab-content">
        <!-- Визуальный Прогресс-бар -->
        <div class="card">
            <label>📊 План добычи на месяц:</label>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="stats-summary">
                <span>Загрузка данных...</span>
            </div>
        </div>

        <!-- Интерактивный График -->
        <div class="card">
            <label>📈 Динамика добычи (тонны):</label>
            <div class="chart-box">
                <canvas id="productionChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Считываем реальный объем из URL параметров
        const urlParams = new URLSearchParams(window.location.search);
        const realTotalVolume = parseInt(urlParams.get('total')) || 0;
        const monthGoal = 20000; // План на месяц

        // Обновляем статистику и прогресс-бар при загрузке
        function updateDashboard() {
            const percent = Math.min(Math.round((realTotalVolume / monthGoal) * 100), 100);
            
            document.getElementById('progressBar').style.width = percent + '%';
            document.querySelector('.stats-summary').innerHTML = `
                <span>Добыто: <b>${realTotalVolume.toLocaleString('ru-RU')} т</b></span>
                <span>План: <b>${monthGoal.toLocaleString('ru-RU')} т (${percent}%)</b></span>
            `;
        }

        updateDashboard();

        // Кнопка внизу Telegram Mini App
        tg.MainButton.setText("ОТПРАВИТЬ ОТЧЁТ");
        tg.MainButton.setTextColor("#000000");
        tg.MainButton.setColor("#ff9800");
        tg.MainButton.show();

        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'form') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-form').classList.add('active');
                tg.MainButton.show();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-analytics').classList.add('active');
                tg.MainButton.hide();
                renderChart();
            }
        }

        // Инициализация Chart.js
        let chartInstance = null;
        function renderChart() {
            if (chartInstance) return;

            const ctx = document.getElementById('productionChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Сегодня'],
                    datasets: [{
                        label: 'Добыча (тонн)',
                        data: [1800, 2100, 1950, 2300, 2000, 2400, realTotalVolume],
                        borderColor: '#ff9800',
                        backgroundColor: 'rgba(255, 152, 0, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#aaa' }, grid: { color: '#333' } },
                        y: { ticks: { color: '#aaa' }, grid: { color: '#333' } }
                    }
                }
            });
        }

        // Обработка клика по Главной кнопке Telegram
        tg.MainButton.onClick(function () {
            const shift = document.getElementById("shift").value;
            const volume = document.getElementById("volume").value;

            if (!volume) {
                tg.showAlert("Пожалуйста, укажите объем добычи!");
                return;
            }

            const data = {
                action: "submit_report",
                shift: shift,
                volume: volume,
                equipment: {
                    belaz: document.getElementById("belaz").value,
                    cat: document.getElementById("cat").value,
                    komatsu: document.getElementById("komatsu").value
                },
                comment: document.getElementById("comment").value,
                timestamp: new Date().toLocaleString("ru-RU")
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
